# Claude Code の OpenTelemetry 出力を受けて、JSON Lines でファイルに書き出すだけの Collector 設定。
# 集計は scripts/report.py が行う(ジョブごとのフェーズ時刻で振り分ける)。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  file/logs:
    path: /data/logs.jsonl
  file/metrics:
    path: /data/metrics.jsonl

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics]
